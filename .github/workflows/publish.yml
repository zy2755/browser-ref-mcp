name: Publish to npm

# 触发方式：推一个 v 开头的 tag（如 v0.1.1）即发布。
# 也支持在 GitHub 页面手动点 Run workflow 补救。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Trusted Publishing 的硬性前提：id-token: write 用于换取 OIDC 短时凭证。
# contents: read 是 checkout 需要的，不要给更多权限。
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # 发布构建绝不要用依赖缓存，否则可能装到旧的依赖树
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json = $PKG_VERSION / tag = $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION 与 package.json 的 $PKG_VERSION 不一致，已中止发布"
            exit 1
          fi

      - name: Publish
        # 走 OIDC，不需要 NODE_AUTH_TOKEN。provenance 由 npm 自动生成。
        run: npm publish
